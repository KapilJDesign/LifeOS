<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life OS settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Life OS settings</h1>

      <label class="label" for="app-url">App URL</label>
      <input id="app-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" />
      <p class="label">Where Life OS runs. Use http://localhost:5173 for local development.</p>

      <label class="check">
        <input id="open-in-tab" type="checkbox" />
        Open in a new tab instead of a small window
      </label>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="save" type="button" class="primary">Save settings</button>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
